
<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>202</title>

  <!-- CSS 연결 -->
  <link rel="stylesheet" href="style.css" />

  <!-- JS 연결 -->
  <script src="script.js" defer></script>
</head>

<body>

  <div id="app">

    <!-- 1. 헤더 -->
    <div id="header">
      <span class="title">🏠 202(로고)</span>
    </div>

    <!-- 2. HOUSE -->
    <div id="house">

      <!-- 3. 다락방 -->
      <div id="attic">
        <span class="label">🏚 지붕</span>
      </div>

      <!-- 4. 집 본체 -->
      <div id="house-wrapper">

        <!-- 5. HOUSE BODY -->
        <div id="house-body">

          <!-- 방 4개 -->
          <div id="room-grid">

            <div class="room" onclick="loadRoom('room1.html')">
              <span class="label">🔴 ROOM 1</span>
            </div>

            <div class="room" onclick="loadRoom('room2.html')">
              <span class="label">🔴 ROOM 2</span>
            </div>

            <div class="room" onclick="loadRoom('room3.html')">
              <span class="label">🔴 ROOM 3</span>
            </div>

            <div class="room" onclick="loadRoom('room4.html')">
              <span class="label">🔴 ROOM 4</span>
            </div>

          </div>

          <!-- 방 클릭 후 표시되는 iframe -->
          <iframe
            id="content-frame"
            title="콘텐츠 영역">
          </iframe>

        </div>

      </div>

    </div>

  </div>

</body>
</html>
